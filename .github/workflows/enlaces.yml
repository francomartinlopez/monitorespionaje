name: Revisar enlaces de las fuentes
# Una vez por semana, después de la actualización de los lunes. No bloquea: deja el informe en el resumen del trabajo.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar URLs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 25 --max-retries 2
            --accept 200..=399,401,403,429
            --exclude-loopback
            data/paises/*.js data/meta.js data/relaciones.js data/explorar.js
          fail: false
          jobSummary: true
